# Deploys the site to Cloudflare on every push to main.
# Needs two repository secrets (Settings -> Secrets and variables -> Actions):
#   CLOUDFLARE_API_TOKEN  - an API token with "Edit Cloudflare Workers" and "D1 Edit" permissions
#   CLOUDFLARE_ACCOUNT_ID - your Cloudflare account ID
# and the D1 database_id filled in wrangler.toml. Until then this job skips itself.
name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Cloudflare is set up
        id: ready
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$TOKEN" ] || grep -q REPLACE_WITH_YOUR_DATABASE_ID wrangler.toml; then
            echo "Cloudflare secrets or database_id not set yet; skipping deploy."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.ready.outputs.ok == 'true'
        with:
          node-version: 22
      - run: npm ci || npm install
        if: steps.ready.outputs.ok == 'true'
      - name: Apply database migrations
        if: steps.ready.outputs.ok == 'true'
        run: npx wrangler d1 migrations apply revision-db --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy
        if: steps.ready.outputs.ok == 'true'
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
