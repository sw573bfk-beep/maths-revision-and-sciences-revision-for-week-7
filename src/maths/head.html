<title>Year 8 Maths Revision Hub</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Lexend:wght@300;400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: an exercise book on graph paper. Sticky tab strip, one working column, a topic rail on wide screens. */
:root{
  --paper:#f6f8fc; --card:#ffffff; --ink:#18202f; --muted:#566077; --line:#e2e8f2; --rule:#c9d3e4;
  --accent:#2443c2; --accent-ink:#ffffff; --accent-soft:#e5eafb;
  --hi:#fff066; --pen:#c42f28; --pen-soft:#fbe4e2;
  --good:#16774a; --good-soft:#e0f2e7; --warn:#935800; --warn-soft:#fdefd6;
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Lexend","Segoe UI",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0e1219; --card:#161b24; --ink:#e6e9f0; --muted:#9aa3b6; --line:#1a212c; --rule:#2c3546;
    --accent:#8fa4ff; --accent-ink:#0c1230; --accent-soft:#1c2547;
    --hi:#5b4d00; --pen:#ff7f75; --pen-soft:#37130f;
    --good:#5bd393; --good-soft:#10291b; --warn:#f0b257; --warn-soft:#33240a; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0e1219; --card:#161b24; --ink:#e6e9f0; --muted:#9aa3b6; --line:#1a212c; --rule:#2c3546;
  --accent:#8fa4ff; --accent-ink:#0c1230; --accent-soft:#1c2547;
  --hi:#5b4d00; --pen:#ff7f75; --pen-soft:#37130f;
  --good:#5bd393; --good-soft:#10291b; --warn:#f0b257; --warn-soft:#33240a; color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background-color:var(--paper); color:var(--ink); font-family:var(--f-body); font-size:15.5px; line-height:1.6; font-weight:400;
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:26px 26px; background-attachment:fixed;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--card)}
h1,h2,h3,h4{font-family:var(--f-display);line-height:1.15;text-wrap:balance;margin:0}
h2{font-size:clamp(1.45rem,1.1rem + 1.4vw,2rem);font-weight:800;letter-spacing:-.01em}
h3{font-size:1.2rem;font-weight:600}
h4{font-size:1rem;font-weight:600}
p{margin:0}
a{color:var(--accent)}
code,.m{font-family:var(--f-mono);font-size:.93em}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:4px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* header + tabs */
.top{background:var(--card);border-bottom:1px solid var(--rule)}
.top-in{max-width:1180px;margin:0 auto;padding-block:18px 10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;gap:16px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap}
.brand-mark{display:inline-block;font-family:var(--f-mono);font-size:.78rem;color:var(--pen);border:1.5px solid var(--pen);border-radius:4px;padding:0 6px;transform:rotate(-2deg);margin-bottom:6px}
.brand h1{font-size:clamp(1.6rem,1.2rem + 2vw,2.5rem);font-weight:800;letter-spacing:-.02em}
.brand .sub{color:var(--muted);font-size:.9rem;margin-top:4px}
.top-tools{display:flex;gap:8px;align-items:center}
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--card);border-bottom:1px solid var(--rule)}
.tabs-in{max-width:1180px;margin:0 auto;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px))}
.tabs-in::-webkit-scrollbar{display:none}
.tabs a{flex:0 0 auto;text-decoration:none;color:var(--muted);font-weight:500;padding:11px 12px 9px;border-bottom:3px solid transparent;white-space:nowrap;font-size:.95rem}
.tabs a:hover{color:var(--ink)}
.tabs a.on{color:var(--accent);border-bottom-color:var(--accent)}

/* page */
.wrap{max-width:1180px;margin:0 auto;padding-block:22px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.view{display:flex;flex-direction:column;gap:18px}
.view-head{display:flex;flex-direction:column;gap:6px}
.view-head p{color:var(--muted);max-width:68ch}
.card{background:var(--card);border:1px solid var(--rule);border-radius:var(--r);padding:18px;min-width:0}
.card.flat{background:transparent;border:none;padding:0}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:14px}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.eyebrow{font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.hl{background:linear-gradient(transparent 52%,var(--hi) 52%,var(--hi) 92%,transparent 92%)}
.pen{color:var(--pen)}
.scroll-x{overflow-x:auto;max-width:100%}

/* buttons, inputs, chips */
.btn{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--accent);background:var(--accent);color:var(--accent-ink);border-radius:8px;padding:8px 14px;font-weight:500;cursor:pointer;line-height:1.2;text-decoration:none}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.ghost:hover{background:var(--accent-soft)}
.btn.sm{padding:5px 10px;font-size:.88rem}
.btn.quiet{border-color:var(--rule);background:var(--card);color:var(--ink)}
.btn.quiet:hover{border-color:var(--accent)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
input[type=text],input[type=number],input[type=date],input[type=search],select,textarea{background:var(--card);border:1.5px solid var(--rule);border-radius:8px;padding:8px 11px;min-width:0;max-width:100%}
select{width:100%}
label.f{min-width:0;max-width:100%}
.row>label.f>select{width:auto;max-width:100%}
input[type=text]:focus,input[type=number]:focus,input[type=search]:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
input.ans{font-family:var(--f-mono);width:min(100%,320px)}
.chip{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--rule);background:var(--card);border-radius:999px;padding:4px 11px;font-size:.86rem;cursor:pointer;color:var(--ink)}
.chip:hover{border-color:var(--accent)}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tag{display:inline-block;font-family:var(--f-mono);font-size:.75rem;font-weight:600;padding:1px 7px;border-radius:5px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.tag.star{background:var(--warn-soft);color:var(--warn)}
.keys{display:flex;gap:4px;flex-wrap:wrap}
.keys button{font-family:var(--f-mono);min-width:34px;padding:4px 7px;border:1px solid var(--rule);background:var(--paper);border-radius:6px;cursor:pointer}
.keys button:hover{border-color:var(--accent)}

/* feedback + solutions */
.fb{border-radius:8px;padding:10px 12px;font-size:.95rem}
.fb.good{background:var(--good-soft);color:var(--good);border:1px solid var(--good)}
.fb.bad{background:var(--pen-soft);color:var(--pen);border:1px solid var(--pen)}
.fb.info{background:var(--accent-soft);color:var(--ink);border:1px solid var(--rule)}
.fb b{color:inherit}
.steps{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px;counter-reset:st}
.steps li{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;align-items:baseline;counter-increment:st}
.steps li::before{content:counter(st);font-family:var(--f-mono);font-size:.75rem;color:var(--muted);border:1px solid var(--rule);border-radius:50%;width:22px;height:22px;display:inline-grid;place-items:center}
.steps .st{font-family:var(--f-mono);font-size:.95rem;overflow-wrap:anywhere}
.steps .why{grid-column:2;color:var(--muted);font-size:.85rem;margin-top:-2px}
.sol{border-left:3px solid var(--pen);padding:6px 0 6px 14px;display:flex;flex-direction:column;gap:8px}
.sol-title{font-family:var(--f-display);font-weight:600;color:var(--pen)}
.rep{text-decoration:overline;text-decoration-thickness:1.5px}

/* question card */
.qcard{display:flex;flex-direction:column;gap:12px}
.qhead{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.qtext{font-size:1.06rem}
.qtext b{font-weight:600}
.qfig{display:flex;justify-content:flex-start;overflow-x:auto;max-width:100%}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:8px}
.choice{text-align:left;border:1.5px solid var(--rule);background:var(--card);border-radius:8px;padding:9px 12px;cursor:pointer}
.choice:hover{border-color:var(--accent)}
.choice.sel{border-color:var(--accent);background:var(--accent-soft)}
.choice.right{border-color:var(--good);background:var(--good-soft)}
.choice.wrong{border-color:var(--pen);background:var(--pen-soft)}
.choice .lt{font-weight:600;margin-right:6px;color:var(--muted)}
table.vals{border-collapse:collapse;font-family:var(--f-mono);font-size:.92rem}
table.vals td,table.vals th{border:1px solid var(--rule);padding:4px 12px;text-align:center}
table.vals th{background:var(--accent-soft);font-weight:600}

/* svg */
svg{max-width:100%;height:auto}
.grid-svg,.nl,.dia{display:block}
.gl{stroke:var(--line);stroke-width:1}
.dia .gl,.grid-svg .gl{stroke:var(--rule);stroke-opacity:.55}
.ax{stroke:var(--ink);stroke-width:1.5;fill:none}
.tk{fill:var(--muted);font-size:10px;font-family:var(--f-mono);text-anchor:middle}
.axl{fill:var(--ink);font-size:12px;font-style:italic;font-family:var(--f-body)}
.pl{stroke:var(--accent);stroke-width:2.5;fill:none}
.pl.b,.poly.b{stroke:var(--pen)}
.pl.c,.poly.c{stroke:var(--good)}
.pl.d,.poly.d{stroke:var(--warn)}
.poly{stroke:var(--accent);stroke-width:2;fill:var(--accent);fill-opacity:.12}
.poly.b{fill:var(--pen)}
.poly.c{fill:var(--good)}
.poly.d{fill:var(--warn)}
.pt{fill:var(--accent)}
.pt.b{fill:var(--pen)} .pt.c{fill:var(--good)} .pt.d{fill:var(--warn)}
.ptl{fill:var(--ink);font-size:11px;font-weight:600;font-family:var(--f-body)}
.mirror{stroke:var(--warn);stroke-width:2;stroke-dasharray:6 4}
.nl .sol-line{stroke:var(--pen);stroke-width:4}
.nl .arrowh{fill:var(--pen)}
.nl .dot{stroke:var(--pen);stroke-width:2.5}
.nl .dot.closed{fill:var(--pen)}
.nl .dot.open{fill:var(--card)}
.nl .axh{fill:var(--ink)}
.dia .edge{stroke:var(--accent);stroke-width:2;fill:none}
.dia .edge.dash{stroke-dasharray:5 4}
.dia .fillt{fill:var(--accent);fill-opacity:.08;stroke:var(--accent);stroke-width:2}
.dia text{fill:var(--ink);font-size:12px;font-family:var(--f-body)}
.dia .lbl{font-weight:700}
.dia .it{font-style:italic}
.dia .ra{fill:none;stroke:var(--ink);stroke-width:1.2}
.dia .tick{stroke:var(--pen);stroke-width:1.6}
.dia .pt3{fill:var(--accent)}

/* home */
.hero{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:18px}
@media (max-width:760px){.hero{grid-template-columns:1fr}}
.bignum{font-family:var(--f-display);font-weight:800;font-size:2.4rem;line-height:1}
.bar{height:10px;border-radius:99px;background:var(--line);overflow:hidden;border:1px solid var(--rule)}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar.good>i{background:var(--good)}
.unit-prog{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center}
table.check{width:100%;border-collapse:collapse;font-size:.92rem}
table.check td,table.check th{border-bottom:1px solid var(--rule);padding:7px 6px;text-align:left;vertical-align:middle}
table.check th{font-size:.74rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
table.check tr.sec td{background:var(--accent-soft);font-weight:600;color:var(--accent);font-size:.8rem;letter-spacing:.06em;text-transform:uppercase}
.conf{display:inline-flex;border:1.5px solid var(--rule);border-radius:8px;overflow:hidden}
.conf button{border:none;background:var(--card);padding:4px 9px;cursor:pointer;font-size:.82rem;white-space:nowrap}
.conf button+button{border-left:1px solid var(--rule)}
.conf button.on[data-c="0"]{background:var(--pen-soft);color:var(--pen);font-weight:600}
.conf button.on[data-c="1"]{background:var(--warn-soft);color:var(--warn);font-weight:600}
.conf button.on[data-c="2"]{background:var(--good-soft);color:var(--good);font-weight:600}
.reflink{font-family:var(--f-mono);font-size:.8rem;background:none;border:none;color:var(--accent);cursor:pointer;padding:0 2px;text-decoration:underline}
@media (max-width:620px){
  table.check thead{display:none}
  table.check tr:not(.sec){display:grid;grid-template-columns:1fr;gap:4px;padding:8px 0;border-bottom:1px solid var(--rule)}
  table.check tr:not(.sec) td{border:none;padding:0 4px}
}

/* learn */
.learn{display:grid;grid-template-columns:260px minmax(0,1fr);gap:18px;align-items:start}
.toc{position:sticky;top:calc(env(safe-area-inset-top,0px) + 58px);max-height:calc(100vh - 80px);overflow:auto;display:flex;flex-direction:column;gap:12px}
.toc h4{font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:4px 0 2px}
.toc button{display:flex;gap:8px;align-items:baseline;width:100%;text-align:left;border:none;background:none;padding:6px 8px;border-radius:7px;cursor:pointer;color:var(--ink)}
.toc button:hover{background:var(--accent-soft)}
.toc button.on{background:var(--accent);color:var(--accent-ink)}
.toc button.on .tag{background:var(--accent-ink);color:var(--accent)}
.toc-select{display:none}
@media (max-width:860px){.learn{grid-template-columns:1fr}.toc{display:none}.toc-select{display:block;width:100%}}
.notes{display:flex;flex-direction:column;gap:12px;max-width:76ch}
.notes ul{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:4px}
.notes table{border-collapse:collapse;font-size:.9rem}
.notes table td,.notes table th{border:1px solid var(--rule);padding:5px 9px;text-align:left;vertical-align:top}
.notes table th{background:var(--accent-soft)}
.rule-box{border:1.5px dashed var(--accent);border-radius:8px;padding:10px 14px;background:var(--accent-soft)}
.rule-box .m{font-weight:600}
.mistake{border-left:3px solid var(--pen);padding:2px 0 2px 12px}
.cans{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.cans li{display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap;border-bottom:1px dotted var(--rule);padding-bottom:6px}
details.ex{border:1px solid var(--rule);border-radius:8px;padding:10px 14px;background:var(--card)}
details.ex summary{cursor:pointer;font-weight:500}
details.ex[open] summary{margin-bottom:8px}

/* booklet */
.bk-q{display:flex;flex-direction:column;gap:10px;scroll-margin-top:70px}
.bk-q .qid{font-family:var(--f-display);font-weight:800;color:var(--accent);font-size:1.15rem;margin-right:6px}
.bk-parts{display:flex;flex-direction:column;gap:8px}
.bk-part{display:grid;grid-template-columns:28px minmax(0,1fr);gap:4px 8px;padding:8px 0;border-top:1px dotted var(--rule)}
.bk-part .pl-l{font-weight:700;color:var(--muted)}
.bk-part .ctrl{grid-column:2;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.bk-part .ansbox{grid-column:2}
.bk-part.done-1 .pl-l{color:var(--good)}
.bk-part.done-0 .pl-l{color:var(--pen)}
.markbtn{border:1.5px solid var(--rule);background:var(--card);border-radius:6px;padding:3px 8px;cursor:pointer;font-size:.82rem}
.markbtn.on.ok{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.markbtn.on.no{background:var(--pen-soft);border-color:var(--pen);color:var(--pen)}

/* flashcards */
.flash{perspective:1200px;max-width:560px;width:100%;margin:0 auto}
.flash-in{position:relative;min-height:230px;transition:transform .5s;transform-style:preserve-3d;cursor:pointer}
.flash.flipped .flash-in{transform:rotateY(180deg)}
.flash-face{position:absolute;inset:0;backface-visibility:hidden;display:flex;flex-direction:column;justify-content:center;gap:10px;padding:24px;border:1.5px solid var(--rule);border-radius:14px;background:var(--card);text-align:center;font-size:1.08rem}
.flash-face.back{transform:rotateY(180deg);background:var(--accent-soft)}
.flash-face .fl-t{font-family:var(--f-display);font-weight:600;font-size:1.25rem}
@media (prefers-reduced-motion:reduce){.flash-in{transition:none}}

/* glossary */
.gl-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:10px}
.gl-item{background:var(--card);border:1px solid var(--rule);border-radius:8px;padding:10px 14px}
.gl-item dt{font-family:var(--f-display);font-weight:600;font-size:1.05rem;display:flex;justify-content:space-between;gap:8px}
.gl-item dd{margin:4px 0 0;color:var(--ink);font-size:.93rem}

/* exam */
.timer{font-family:var(--f-mono);font-size:1.4rem;font-weight:600}
.timer.low{color:var(--pen)}
.exam-bar{position:sticky;top:calc(env(safe-area-inset-top,0px) + 46px);z-index:10;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;background:var(--card);border:1px solid var(--rule);border-radius:var(--r);padding:10px 14px}
.result-good{color:var(--good)} .result-bad{color:var(--pen)}
table.res{border-collapse:collapse;width:100%;font-size:.92rem}
table.res td,table.res th{border-bottom:1px solid var(--rule);padding:6px 8px;text-align:left}

/* ask */
.ask-box{display:flex;gap:8px;flex-wrap:wrap}
.ask-box input{flex:1 1 260px;font-size:1.05rem;padding:11px 14px}
.ask-out{display:flex;flex-direction:column;gap:12px}

/* tools */
.tool-out{display:flex;flex-direction:column;gap:12px}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;font-size:.95rem}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-family:var(--f-mono);overflow-wrap:anywhere}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.85rem;color:var(--muted)}
label.f>input,label.f>select{color:var(--ink)}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:8px 16px;border-radius:999px;font-size:.9rem;z-index:50;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.show{opacity:1}
footer.foot{max-width:1180px;margin:0 auto;padding-block:0 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));color:var(--muted);font-size:.82rem}
</style>
